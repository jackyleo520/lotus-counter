plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lotus.nianfo'
    compileSdk 34

    defaultConfig {
        applicationId "com.lotus.nianfo"
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName "1.0.1.2"
    }

    signingConfigs {
        release {
            storeFile file("D:/nianfo_keystore/nianfo-release-key.jks")
            storePassword "nianfo123456"
            keyAlias "nianfo"
            keyPassword "nianfo123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // JavaMail 两个 jar 都带 META-INF/NOTICE.md 等，打包冲突，需排除
    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "九品莲台.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    // 意见反馈内置邮件发送（QQ SMTP）
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
